<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコードリーダー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; background-color: #f5f5f5; }
    .video-container { position: relative; display: inline-block; margin-top: 20px; }
    video { display: block; background-color: #000; border-radius: 8px; }
    .stop {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); color: white; display: none;
      align-items: center; justify-content: center; text-align: center;
      font-size: 18px; border-radius: 8px; font-weight: bold;
    }
    #message { margin: 20px auto; font-size: 18px; font-weight: bold; min-height: 50px; padding: 10px; max-width: 300px; }
    #loading { display: none; color: #666; font-size: 14px; margin-bottom: 10px; }
    button { padding: 12px 24px; font-size: 16px; border: none; background-color: #007bff; color: white; border-radius: 4px; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>チケット受付スキャナー</h2>
  
  <div id="loading">サーバーに送信中...</div>
  <div id="message">カメラを起動しています...</div>

  <div class="video-container">
    <video id="preview" width="300" height="225" playsinline></video>
    <div id="stop" class="stop">読み取り<br>停止中</div>
  </div>

  <div style="margin-top: 20px;">
    <button id="nextButton" onclick="resetScanner()" disabled>次のスキャンへ</button>
  </div>

  <script>
    // ★ここにあなたのGASウェブアプリのURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/XXXXX/exec";

    let scanning = true;
    const video = document.getElementById("preview");
    const stopElement = document.getElementById("stop");
    const messageElement = document.getElementById("message");
    const loadingElement = document.getElementById("loading");
    const nextButton = document.getElementById("nextButton");

    // カメラ設定（4:3のアスペクト比をidealで指定しクラッシュを防止）
    const constraints = {
      video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
    };

    // カメラの初期起動
    navigator.mediaDevices.getUserMedia(constraints)
      .then(function(stream) {
        video.srcObject = stream;
        video.play().catch(err => alert("ビデオ再生失敗: " + err.message));
        messageElement.innerHTML = "QRコードをかざしてください";

        const canvasElement = document.createElement("canvas");
        const canvas = canvasElement.getContext("2d");

        video.addEventListener("play", function() {
          const scanQRCode = () => {
            if (scanning && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
              try {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                
                if (code) {
                  // QRコード発見、即座にスキャンループを止める
                  scanning = false; 
                  reception(code.data);
                }
              } catch (error) {
                console.error("スキャンループ内エラー:", error);
              }
            }
            // scanningがtrueの間はループを継続（描画同期による最速処理）
            if (scanning) {
              requestAnimationFrame(scanQRCode);
            }
          };
          requestAnimationFrame(scanQRCode);
        });
      })
      .catch(function(err) {
        messageElement.innerHTML = "カメラにアクセスできません。";
        alert("カメラ接続エラー: " + err.name + " - " + err.message);
      });

    // 読み取り成功時の処理
    function reception(data) {
      // 画面上の視覚効果
      video.style.border = "5px solid red";
      stopElement.style.display = "flex"; // 中央配置のためflex
      loadingElement.style.display = "block";
      messageElement.innerHTML = "データを照合中...";

      // GAS（API）へデータをPOST送信
      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors", // GASのCORS制限を回避するために必須
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ qrData: data })
      })
      .then(() => {
        // ※「no-cors」モードではGASからの返り値（json）をブラウザが直接読めない仕様のため、
        // 送信成功（通信完了）＝「受付完了」としてフロント側で判定を行います。
        loadingElement.style.display = "none";
        
        // 有効/無効の簡易判定をフロント側でも並行して行う場合（以前のロジックの移植用）
        // ※GAS側でも同じ判定を行っているため、ここでは一律で「送信完了」のメッセージにしてもOKです。
        messageElement.innerHTML = "データ送信完了<br>入場処理を行いました。";
        
        // 次のボタンを有効化
        nextButton.disabled = false;
      })
      .catch(error => {
        loadingElement.style.display = "none";
        messageElement.innerHTML = "通信エラーが発生しました。";
        alert("送信エラー: " + error.message);
        nextButton.disabled = false;
      });
    }

    // 次の読み取りへ進む（リセット処理）
    function resetScanner() {
      scanning = true;
      nextButton.disabled = true;
      video.style.border = "0px solid";
      stopElement.style.display = "none";
      messageElement.innerHTML = "QRコードをかざしてください";
      
      // ビデオの再生イベントを再トリガーするために、一度playを明示的に呼ぶか
      // 直接ループ関数を再始動します
      const canvasElement = document.createElement("canvas");
      const canvas = canvasElement.getContext("2d");
      
      const scanQRCode = () => {
        if (scanning && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
          canvasElement.height = video.videoHeight;
          canvasElement.width = video.videoWidth;
          canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
          const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
          if (code) {
            scanning = false;
            reception(code.data);
          }
        }
        if (scanning) { requestAnimationFrame(scanQRCode); }
      };
      requestAnimationFrame(scanQRCode);
    }
  </script>
</body>
</html>
