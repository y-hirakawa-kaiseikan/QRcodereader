<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコードリーダー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * {
      -webkit-appearance: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -moz-user-select:none;
      -webkit-user-select:none;
      -khtml-user-select:none;
    }
    body{
      background-color: #fff8dc;
      text-align: left;
    }
    h1{
      color: #9F3B42;
    }
    button{
      font-size: 2em;
      background: #f1e767;
      background: -webkit-gradient(linear, left top, left bottom, from(#f1e767), to(#feb645));
      background: -webkit-linear-gradient(top, #f1e767 0%, #feb645 100%);
      background: linear-gradient(to bottom, #f1e767 0%, #feb645 100%);
    }

    ol {
      counter-reset: my-counter;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      font-size: 20px;
      line-height: 1.5;
      padding-left: 30px;
      position: relative;
    }
    li:before {
      content: counter(my-counter);
      counter-increment: my-counter;
      background-color: #333;
      border: 1px solid;
      border-radius: 50%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 22px;
      width: 22px;
      color: #ffffff;
      line-height: 1;
      position: absolute;
      top: 0;
      left: 0;
    }

    .stop{
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 35px;
      font-weight: bold;
      display: none;
      text-align: center;
      text-shadow: 1px 1px 2px white, -1px -1px 2px white, -1px 1px 2px white, 1px -1px 2px white;"
    }

    .spinner {
      border: 16px solid #f3f3f3;
      border-top: 16px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loadingContainer {
      display: flex;
      align-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <h2>チケット受付スキャナー</h2>
  
  <div id="loading">サーバーに送信中...</div>
  <div id="message">カメラを起動しています...</div>

  <div class="video-container">
    <video id="preview" width="300" height="225" playsinline></video>
    <div id="stop" class="stop">読み取り<br>停止中</div>
  </div>

  <div style="margin-top: 20px;">
    <button id="nextButton" onclick="resetScanner()" disabled>次のスキャンへ</button>
  </div>

  <h2>受付係の方へ<h2>
  ☆受付の手順☆
  <ol>
    <li>来場者のチケットにあるQRコード<sup>&reg;</sup>を読み取る。</li>
    <li>来場者情報が登録されていることを確認する。</li>
    <li>パンフレットを渡す。</li>
    <li>「次の受付」ボタンを押す。</li>
  </ol>
  <p style="font-size:15pt;">
  ※注意事項<br>
  ・チケットの読み取りから「次の受付」ボタンを押すまでの間、QRコード<sup>&reg;</sup>の読み取りは停止しています。必ず、ボタンを押してから次の読み取りをしてください。<br>
  ・QRコード<sup>&reg;</sup>の背景が薄い赤色の場合、再入場です。<br><br>
  ※QRコードは株式会社デンソーウェーブの登録商標です
  </p>

  <script>
    // ★ここにあなたのGASウェブアプリのURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwKsTRoT67Fs3bu2uZarTuqfiFhRsPl6mmMEuoT2wQmag9Dn5KJfYSJBgYI3wFtSTJZ/exec";

    let scanning = true;
    const video = document.getElementById("preview");
    const stopElement = document.getElementById("stop");
    const messageElement = document.getElementById("message");
    const loadingElement = document.getElementById("loading");
    const nextButton = document.getElementById("nextButton");

    // カメラ設定（4:3のアスペクト比をidealで指定しクラッシュを防止）
    const constraints = {
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
    };

    // カメラの初期起動
    navigator.mediaDevices.getUserMedia(constraints)
      .then(function(stream) {
        video.srcObject = stream;
        video.play().catch(err => alert("ビデオ再生失敗: " + err.message));
        messageElement.innerHTML = "QRコードをかざしてください";

        const canvasElement = document.createElement("canvas");
        const canvas = canvasElement.getContext("2d");

        video.addEventListener("play", function() {
          const scanQRCode = () => {
            if (scanning && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
              try {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                
                if (code) {
                  // QRコード発見、即座にスキャンループを止める
                  scanning = false; 
                  reception(code.data);
                }
              } catch (error) {
                console.error("スキャンループ内エラー:", error);
              }
            }
            // scanningがtrueの間はループを継続（描画同期による最速処理）
            if (scanning) {
              requestAnimationFrame(scanQRCode);
            }
          };
          requestAnimationFrame(scanQRCode);
        });
      })
      .catch(function(err) {
        messageElement.innerHTML = "カメラにアクセスできません。";
        alert("カメラ接続エラー: " + err.name + " - " + err.message);
      });

    // 読み取り成功時の処理
    function reception(data) {
      // 画面上の視覚効果
      video.style.border = "5px solid red";
      stopElement.style.display = "flex"; // 中央配置のためflex
      loadingElement.style.display = "block";
      messageElement.innerHTML = "データを照合中...";

      // GAS（API）へデータをPOST送信
      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors", // GASのCORS制限を回避するために必須
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ qrData: data })
      })
      .then(() => {
        // ※「no-cors」モードではGASからの返り値（json）をブラウザが直接読めない仕様のため、
        // 送信成功（通信完了）＝「受付完了」としてフロント側で判定を行います。
        loadingElement.style.display = "none";
        
        // 有効/無効の簡易判定をフロント側でも並行して行う場合（以前のロジックの移植用）
        // ※GAS側でも同じ判定を行っているため、ここでは一律で「送信完了」のメッセージにしてもOKです。
        messageElement.innerHTML = "データ送信完了<br>入場処理を行いました。";
        
        // 次のボタンを有効化
        nextButton.disabled = false;
      })
      .catch(error => {
        loadingElement.style.display = "none";
        messageElement.innerHTML = "通信エラーが発生しました。";
        alert("送信エラー: " + error.message);
        nextButton.disabled = false;
      });
    }

    // 次の読み取りへ進む（リセット処理）
    function resetScanner() {
      scanning = true;
      nextButton.disabled = true;
      video.style.border = "0px solid";
      stopElement.style.display = "none";
      messageElement.innerHTML = "QRコードをかざしてください";
      
      // ビデオの再生イベントを再トリガーするために、一度playを明示的に呼ぶか
      // 直接ループ関数を再始動します
      const canvasElement = document.createElement("canvas");
      const canvas = canvasElement.getContext("2d");
      
      const scanQRCode = () => {
        if (scanning && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
          canvasElement.height = video.videoHeight;
          canvasElement.width = video.videoWidth;
          canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
          const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
          if (code) {
            scanning = false;
            reception(code.data);
          }
        }
        if (scanning) { requestAnimationFrame(scanQRCode); }
      };
      requestAnimationFrame(scanQRCode);
    }
  </script>
</body>
</html>
