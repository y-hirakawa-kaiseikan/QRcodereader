<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
      * {
        -webkit-appearance: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -moz-user-select:none;
        -webkit-user-select:none;
        -khtml-user-select:none;
      }
      body{
        background-color: #fff8dc; 
      }
      h1{
        color: #9F3B42;
      }
      button{
        font-size: 2em;
        background: #f1e767;
        background: -webkit-gradient(linear, left top, left bottom, from(#f1e767), to(#feb645));
        background: -webkit-linear-gradient(top, #f1e767 0%, #feb645 100%);
        background: linear-gradient(to bottom, #f1e767 0%, #feb645 100%);
      }

      ol {
        counter-reset: my-counter;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        font-size: 20px;
        line-height: 1.5;
        padding-left: 30px;
        position: relative;
      }
      li:before {
        content: counter(my-counter);
        counter-increment: my-counter;
        background-color: #333;
        border: 1px solid;
        border-radius: 50%;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 22px;
        width: 22px;
        color: #ffffff;
        line-height: 1;
        position: absolute;
        top: 0;
        left: 0;
      }

      .stop{
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: red;
        font-size: 35px;
        font-weight: bold;
        display: none;
        text-align: center;
        text-shadow: 1px 1px 2px white, -1px -1px 2px white, -1px 1px 2px white, 1px -1px 2px white;"
      }

      .spinner {
        border: 16px solid #f3f3f3;
        border-top: 16px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
        margin-right: 10px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #loadingContainer {
        display: flex;
        align-items: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    
    <h1>真澄祭受付</h1>
    <div style="position: relative; display: inline-block;">
      <video id="preview" width="300" height="300" style="border: 0px solid;"></video>
      <div id="stop" class="stop">
        読み取り<br>停止中
      </div>
    </div>

    <p id='message' style="font-size:20pt;"></p>
    <button id="nextButton" disabled>次の受付</button>

    <div id="loadingContainer" style="display: none;">
      <div id="spinner" class="spinner"></div>
      <span style="font-size:30pt">送信中...</span>
    </div>

    <h2>受付係の方へ<h2>
    ☆受付の手順☆
    <ol>
      <li>来場者のチケットにあるQRコード<sup>&reg;</sup>を読み取る。</li>
      <li>来場者情報が登録されていることを確認する。</li>
      <li>パンフレットを渡す。</li>
      <li>「次の受付」ボタンを押す。</li>
    </ol>
    <p style="font-size:15pt;">
    ※注意事項<br>
    ・チケットの読み取りから「次の受付」ボタンを押すまでの間、QRコード<sup>&reg;</sup>の読み取りは停止しています。必ず、ボタンを押してから次の読み取りをしてください。<br>
    ・QRコード<sup>&reg;</sup>の背景が薄い赤色の場合、再入場です。<br><br>
    ※QRコードは株式会社デンソーウェーブの登録商標です
    </p>


    <script>
      //今年の素数
      const familyprime = 202613;
      const friendprime = 202621;
      const message = document.getElementById('message');

      let scanning = true; // スキャン状態を管理
      const video = document.getElementById("preview");
      const stop = document.getElementById("stop");

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream) {
        video.srcObject = stream;
        video.play();

        const canvasElement = document.createElement("canvas");
        const canvas = canvasElement.getContext("2d");

        video.addEventListener("play", function() {
          const scanQRCode = () => {
            if (scanning && video.readyState === video.HAVE_ENOUGH_DATA) {
              canvasElement.height = video.videoHeight;
              canvasElement.width = video.videoWidth;
              canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
              const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
              const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
              if (code) {
                scanning = false;
                showLoading();
                let data = code.data;
                reception(data);
                video.style.border = "5px solid red";
                stop.style.display = "block";
              }else if(scanning) {
                video.style.border = "0px solid";
                stop.style.display = "none";
              }
            }
          };
          setInterval(scanQRCode, 1000);
        });
      }).catch(function(err) {
          console.error("Error accessing camera: " + err);
      });

      function reception(data) {
        scanning = false; //スキャンを一時停止
        let idcheck = (Number(data) % familyprime === 0 || Number(data) % friendprime === 0);
        if(idcheck) {
          message.innerHTML = '有効なチケットです。<br>入場を受け付けました。';
        }else{
          message.innerHTML = '無効なチケットです。<br>受付できませんでした。';
        }
        hideLoading();
        document.getElementById("nextButton").disabled = false;
        google.script.run.ticketcheck(data); //サーバー側にIDを送信
      }

      //次へボタン
      document.getElementById("nextButton").addEventListener("click", function() {
        scanning = true; // 次の受付ボタンが押されたらスキャンを再開
        message.innerHTML = '';
        document.getElementById("nextButton").disabled = true;
      });

      //スピナー表示
      function showLoading() {
        document.getElementById("loadingContainer").style.display = "flex";
      }

      //スピナー非表示
      function hideLoading() {
        document.getElementById("loadingContainer").style.display = "none";
      }
    </script>
  </body>
</html>
